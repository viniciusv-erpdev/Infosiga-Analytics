{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Infosiga Analytics{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'analytics/css/home.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="pageLoader" class="page-loader" aria-hidden="true">
        <div class="page-loader__content">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mb-0 mt-3 fw-semibold">Carregando informações...</p>
        </div>
    </div>

    <nav class="navbar navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Infosiga Analytics</span>
            </span>
        </div>
    </nav>

    <main class="pt-5 mt-5">
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'analytics/js/home.js' %}" defer></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
